<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONA VERITAS | Intelligence Architecture</title>
    
    <!-- Styling Engine: Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React Core Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- JSX Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom print styling for the enforcement engine */
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-area { box-shadow: none !important; padding: 0 !important; border: none !important; }
        }
        
        /* Hide scrollbar for clean mobile tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- ICON SYSTEM ---
        const IconActivity = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>);
        const IconShield = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>);
        const IconDatabase = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>);
        const IconFileText = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>);
        const IconMapPin = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>);
        const IconAlertTriangle = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>);
        const IconCheckCircle = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>);
        const IconSearch = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>);
        const IconTerminal = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>);
        const IconChevronRight = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>);
        const IconPrinter = ({ size=16, className="" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>);

        // --- ENTERPRISE DATA MODEL ---
        const initialDatabase = [
            { id: 'ONA-8829', nif: '000-111-222-3', name: 'Manufacture Nationale S.A.', sector: 'Industrial', location: 'Port-au-Prince', expected: 450000, actual: 0, status: 'critical', monthsLate: 3 },
            { id: 'ONA-1024', nif: '111-222-333-4', name: 'Logistique Ouest', sector: 'Logistics', location: 'Carrefour', expected: 120000, actual: 120000, status: 'compliant', monthsLate: 0 },
            { id: 'ONA-7731', nif: '222-333-444-5', name: 'Agri-Export Sud', sector: 'Agriculture', location: 'Les Cayes', expected: 85000, actual: 40000, status: 'warning', monthsLate: 1 },
            { id: 'ONA-2290', nif: '333-444-555-6', name: 'Telecom Infrastructure', sector: 'Technology', location: 'Delmas', expected: 950000, actual: 0, status: 'critical', monthsLate: 2 },
            { id: 'ONA-4451', nif: '444-555-666-7', name: 'Boutique Le Sommet', sector: 'Retail', location: 'Pétion-Ville', expected: 45000, actual: 45000, status: 'compliant', monthsLate: 0 },
            { id: 'ONA-9982', nif: '555-666-777-8', name: 'Construction Civile Haïti', sector: 'Construction', location: 'Cap-Haïtien', expected: 650000, actual: 200000, status: 'critical', monthsLate: 4 },
        ];

        function VeritasApp() {
            const [activeTab, setActiveTab] = useState('intelligence');
            const [searchQuery, setSearchQuery] = useState('');
            const [database] = useState(initialDatabase);
            const [selectedEntity, setSelectedEntity] = useState(null);
            const [actionLog, setActionLog] = useState([
                { time: new Date().toLocaleTimeString(), action: 'SYSTEM INITIALIZED: SECURE CONNECTION ESTABLISHED' },
                { time: new Date().toLocaleTimeString(), action: 'DATABASE SYNC: ENTITIES LOADED SUCCESSFULLY' }
            ]);

            const filteredData = useMemo(() => {
                return database.filter(entity => 
                    entity.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    entity.nif.includes(searchQuery)
                );
            }, [database, searchQuery]);

            const stats = useMemo(() => {
                const totalExpected = database.reduce((acc, curr) => acc + curr.expected, 0);
                const totalActual = database.reduce((acc, curr) => acc + curr.actual, 0);
                const criticalCount = database.filter(e => e.status === 'critical').length;
                return { totalExpected, totalActual, gap: totalExpected - totalActual, criticalCount };
            }, [database]);

            const executeEnforcement = (entity) => {
                setActionLog(prev => [{ time: new Date().toLocaleTimeString(), action: `LEGAL NOTICE GENERATED: ${entity.id} - ${entity.name}` }, ...prev]);
                setSelectedEntity(entity);
                setActiveTab('enforcement');
            };

            const TabButton = ({ id, icon: Icon, label }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`flex items-center space-x-2 px-4 md:px-6 py-4 text-xs tracking-[0.15em] uppercase transition-all duration-300 whitespace-nowrap ${
                        activeTab === id ? 'border-b-2 border-slate-900 text-slate-900 font-semibold bg-slate-50' : 'text-slate-500 hover:text-slate-900 border-b-2 border-transparent hover:bg-slate-50'
                    }`}
                >
                    <Icon size={14} />
                    <span>{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen flex flex-col no-print font-sans">
                    
                    {/* TOP COMMAND BAR */}
                    <header className="bg-white border-b border-slate-200 px-4 md:px-8 py-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm z-10 relative">
                        <div>
                            <h1 className="text-xl md:text-2xl font-light tracking-widest text-slate-900">
                                ONA <span className="text-blue-900 font-semibold">VERITAS</span>
                            </h1>
                            <p className="text-[9px] md:text-[10px] text-slate-500 tracking-[0.2em] uppercase mt-1">Intelligence & Audit Architecture</p>
                        </div>
                        <div className="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-end">
                            <div className="flex items-center space-x-2 text-[10px] text-emerald-600 tracking-widest font-semibold">
                                <IconActivity size={12} className="animate-pulse" /> <span className="hidden sm:inline">SECURE UPLINK ACTIVE</span><span className="sm:hidden">SECURE</span>
                            </div>
                            <div className="px-3 py-1.5 border border-slate-200 bg-slate-50 flex items-center space-x-2 rounded-sm">
                                <IconShield size={12} className="text-blue-900" />
                                <span className="text-[9px] tracking-widest text-slate-600 font-medium">DIR. AUTHORIZATION</span>
                            </div>
                        </div>
                    </header>

                    {/* NAVIGATION TABS */}
                    <div className="flex overflow-x-auto no-scrollbar px-2 md:px-8 border-b border-slate-200 bg-white shadow-sm z-0 relative">
                        <TabButton id="intelligence" icon={IconActivity} label="Global Intelligence" />
                        <TabButton id="registry" icon={IconDatabase} label="Entity Registry" />
                        <TabButton id="enforcement" icon={IconFileText} label="Enforcement Engine" />
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        
                        {/* VIEW 1: GLOBAL INTELLIGENCE */}
                        {activeTab === 'intelligence' && (
                            <div className="space-y-6 md:space-y-8 animate-in fade-in duration-500 max-w-7xl mx-auto">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    {[
                                        { label: 'Expected Revenue (HTG)', val: stats.totalExpected.toLocaleString(), color: 'text-slate-900' },
                                        { label: 'Reconciled Revenue (HTG)', val: stats.totalActual.toLocaleString(), color: 'text-emerald-700' },
                                        { label: 'Critical Deficit Gap (HTG)', val: stats.gap.toLocaleString(), color: 'text-red-700' },
                                        { label: 'Critical Entities Flagged', val: stats.criticalCount, color: 'text-amber-600' }
                                    ].map((stat, i) => (
                                        <div key={i} className="p-5 bg-white border border-slate-200 rounded-sm shadow-sm hover:shadow-md transition-shadow">
                                            <div className="text-[10px] text-slate-500 tracking-[0.15em] uppercase mb-2 font-medium">{stat.label}</div>
                                            <div className={`text-2xl md:text-3xl font-light tracking-wide ${stat.color}`}>{stat.val}</div>
                                        </div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
                                    <div className="lg:col-span-2 bg-white border border-slate-200 p-4 md:p-6 rounded-sm shadow-sm">
                                        <div className="text-xs text-slate-800 font-semibold tracking-wider uppercase border-b border-slate-100 pb-3 mb-4">High-Risk Entities (Live Feed)</div>
                                        <div className="space-y-3">
                                            {database.filter(e => e.status === 'critical').map(entity => (
                                                <div key={entity.id} className="flex flex-col sm:flex-row sm:justify-between sm:items-center p-4 border border-slate-200 bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer rounded-sm" onClick={() => executeEnforcement(entity)}>
                                                    <div className="flex items-start sm:items-center space-x-3 mb-3 sm:mb-0">
                                                        <IconAlertTriangle size={16} className="text-red-600 mt-0.5 sm:mt-0" />
                                                        <div>
                                                            <div className="text-sm font-semibold text-slate-900">{entity.name}</div>
                                                            <div className="text-xs text-slate-500 font-mono mt-1">{entity.id} | {entity.location}</div>
                                                        </div>
                                                    </div>
                                                    <div className="text-left sm:text-right pl-7 sm:pl-0">
                                                        <div className="text-sm text-red-700 font-mono font-medium">- HTG {(entity.expected - entity.actual).toLocaleString()}</div>
                                                        <div className="text-[10px] text-slate-500 tracking-wider mt-1 uppercase font-semibold">{entity.monthsLate} Months Late</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="lg:col-span-1 bg-white border border-slate-200 p-4 md:p-6 rounded-sm shadow-sm">
                                        <div className="text-xs text-slate-800 font-semibold tracking-wider uppercase border-b border-slate-100 pb-3 mb-4 flex items-center space-x-2">
                                            <IconMapPin size={14} className="text-blue-800"/>
                                            <span>Regional Leakage Audit</span>
                                        </div>
                                        <div className="space-y-6 mt-6">
                                            {['Ouest (Port-au-Prince) - 78%', 'Nord (Cap-Haïtien) - 12%', 'Sud (Les Cayes) - 10%'].map((region, idx) => (
                                                <div key={idx}>
                                                    <div className="flex justify-between text-xs font-medium tracking-wide mb-2 text-slate-700">
                                                        <span>{region.split(' - ')[0]}</span>
                                                        <span className="text-blue-800 font-semibold">{region.split(' - ')[1]}</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                                        <div className="bg-blue-800 h-full rounded-full" style={{ width: region.split(' - ')[1] }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 2: ENTITY REGISTRY */}
                        {activeTab === 'registry' && (
                            <div className="animate-in fade-in duration-500 bg-white border border-slate-200 rounded-sm shadow-sm flex flex-col h-full min-h-[500px] max-w-7xl mx-auto">
                                <div className="p-4 md:p-6 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50">
                                    <div className="relative w-full sm:w-1/2 md:w-1/3">
                                        <IconSearch className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" size={14} />
                                        <input 
                                            type="text" 
                                            placeholder="Search by NIF or Company..." 
                                            className="w-full bg-white border border-slate-300 text-sm text-slate-900 p-2.5 pl-9 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 rounded-sm placeholder-slate-400 transition-shadow"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                    <div className="text-xs text-slate-500 tracking-widest uppercase font-semibold">{filteredData.length} Records Found</div>
                                </div>
                                
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-white border-b-2 border-slate-200 text-[10px] tracking-[0.15em] text-slate-500 uppercase">
                                                <th className="p-4 font-semibold">Entity ID</th>
                                                <th className="p-4 font-semibold">NIF</th>
                                                <th className="p-4 font-semibold">Company Name</th>
                                                <th className="p-4 font-semibold text-right">Expected (HTG)</th>
                                                <th className="p-4 font-semibold text-right">Deficit</th>
                                                <th className="p-4 font-semibold text-center">Status</th>
                                                <th className="p-4 font-semibold text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {filteredData.map(entity => (
                                                <tr key={entity.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="p-4 font-mono text-slate-500 text-xs">{entity.id}</td>
                                                    <td className="p-4 font-mono text-slate-700 text-xs">{entity.nif}</td>
                                                    <td className="p-4 font-medium text-slate-900">{entity.name}</td>
                                                    <td className="p-4 text-right font-mono text-slate-700 text-xs">{entity.expected.toLocaleString()}</td>
                                                    <td className="p-4 text-right font-mono text-red-600 font-medium text-xs">
                                                        {entity.expected - entity.actual > 0 ? `-${(entity.expected - entity.actual).toLocaleString()}` : '0'}
                                                    </td>
                                                    <td className="p-4 flex justify-center">
                                                        {entity.status === 'compliant' ? <IconCheckCircle size={16} className="text-emerald-600" /> : <IconAlertTriangle size={16} className="text-red-600" />}
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => executeEnforcement(entity)} className="text-[10px] font-semibold tracking-widest text-blue-800 hover:text-white border border-blue-800 hover:bg-blue-800 px-3 py-1.5 uppercase transition-colors rounded-sm">
                                                            Audit
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* VIEW 3: ENFORCEMENT ENGINE */}
                        {activeTab === 'enforcement' && (
                            <div className="animate-in fade-in duration-500 h-full min-h-[600px] flex items-start justify-center pt-4 md:pt-8">
                                {!selectedEntity ? (
                                    <div className="text-slate-500 text-sm tracking-widest uppercase flex flex-col items-center space-y-4 mt-20">
                                        <IconFileText size={32} className="text-slate-300" />
                                        <p className="text-center px-4">Select an entity from the Intelligence or Registry tab to generate a legal notice.</p>
                                    </div>
                                ) : (
                                    <div className="w-full max-w-3xl bg-white text-slate-900 p-6 md:p-12 shadow-md border border-slate-200 relative print-area rounded-sm">
                                        <div className="absolute top-4 right-4 md:top-8 md:right-8 flex space-x-4 print:hidden">
                                            <button className="flex items-center space-x-2 text-[10px] md:text-xs tracking-widest font-bold border border-slate-900 text-slate-900 px-3 py-2 hover:bg-slate-900 hover:text-white transition-colors rounded-sm" onClick={() => window.print()}>
                                                <IconPrinter size={14} /> <span className="hidden sm:inline">PRINT / EXPORT PDF</span><span className="sm:hidden">PRINT</span>
                                            </button>
                                        </div>

                                        <div className="text-center border-b-2 border-slate-900 pb-6 mb-8 mt-12 md:mt-4">
                                            <h2 className="text-lg md:text-xl font-bold tracking-widest uppercase text-slate-900">République d'Haïti</h2>
                                            <h3 className="text-sm md:text-base font-semibold tracking-wide mt-2 text-slate-800">Office National d'Assurance-Vieillesse (ONA)</h3>
                                            <p className="text-xs mt-1 italic text-slate-600">Direction Générale - Unité de Conformité Automatisée</p>
                                        </div>

                                        <div className="space-y-6 text-sm leading-relaxed font-serif text-slate-900">
                                            <div className="flex flex-col sm:flex-row justify-between gap-4">
                                                <div>
                                                    <p className="font-bold uppercase">{selectedEntity.name}</p>
                                                    <p>NIF: {selectedEntity.nif}</p>
                                                    <p>Secteur: {selectedEntity.sector} | {selectedEntity.location}</p>
                                                </div>
                                                <div className="text-left sm:text-right">
                                                    <p>Port-au-Prince, le {new Date().toLocaleDateString('fr-FR')}</p>
                                                    <p className="font-mono text-[10px] md:text-xs mt-1 text-slate-500">Réf: ONA-VERITAS-{selectedEntity.id}-{new Date().getFullYear()}</p>
                                                </div>
                                            </div>

                                            <p className="font-bold underline mt-8">Objet : Mise en demeure pour non-paiement des cotisations sociales</p>

                                            <p>Madame, Monsieur le Directeur,</p>

                                            <p>
                                                Par la présente, la Direction Générale de l'Office National d'Assurance-Vieillesse (ONA) vous informe que, suite à l'analyse de notre système de conformité centralisé, votre entreprise présente un déficit critique concernant le versement de vos cotisations sociales obligatoires.
                                            </p>

                                            <div className="bg-slate-50 p-4 md:p-6 border-l-4 border-slate-900 font-mono text-xs my-6">
                                                <p className="font-bold mb-3 text-slate-900">DÉTAIL DU DÉFICIT CONSTATÉ :</p>
                                                <div className="grid grid-cols-2 gap-2 max-w-sm">
                                                    <span className="text-slate-600">Cotisations attendues :</span> <span className="font-semibold text-right">{selectedEntity.expected.toLocaleString()} HTG</span>
                                                    <span className="text-slate-600">Montant réconcilié :</span> <span className="font-semibold text-right">{selectedEntity.actual.toLocaleString()} HTG</span>
                                                    <div className="col-span-2 border-t border-slate-300 my-1"></div>
                                                    <span className="font-bold text-slate-900">Écart total (Dette) :</span> <span className="font-bold text-right text-red-700">{(selectedEntity.expected - selectedEntity.actual).toLocaleString()} HTG</span>
                                                    <span className="text-slate-600">Retard constaté :</span> <span className="text-right">{selectedEntity.monthsLate} mois</span>
                                                </div>
                                            </div>

                                            <p>
                                                Conformément à la législation en vigueur, vous disposez d'un délai de huit (8) jours francs à compter de la réception de la présente pour régulariser votre situation auprès de nos services. À défaut, l'institution se verra dans l'obligation d'engager des poursuites légales pour recouvrer les sommes dues, majorées des pénalités de retard.
                                            </p>

                                            <p>Dans l'attente de votre régularisation, veuillez agréer, Madame, Monsieur le Directeur, l'expression de nos salutations distinguées.</p>

                                            <div className="mt-12 w-48 md:w-64 border-t border-slate-900 pt-3 text-center">
                                                <p className="font-bold text-xs uppercase tracking-wide">La Direction Générale</p>
                                                <p className="text-[9px] text-slate-500 mt-1 font-sans">Document généré automatiquement par ONA Veritas</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* TERMINAL LOG CONSOLE - Light Institutional Theme */}
                    <footer className="h-24 md:h-32 bg-slate-50 border-t border-slate-200 p-3 md:p-4 overflow-y-auto font-mono text-[9px] md:text-[10px]">
                        <div className="flex items-center space-x-2 text-slate-600 font-semibold mb-2 border-b border-slate-200 pb-2">
                            <IconTerminal size={12} /> <span>SYSTEM AUDIT LOG</span>
                        </div>
                        <div className="space-y-1.5 md:space-y-2">
                            {actionLog.map((log, index) => (
                                <div key={index} className="flex flex-col sm:flex-row sm:space-x-4 space-y-1 sm:space-y-0 text-slate-700">
                                    <span className="text-slate-400 font-semibold whitespace-nowrap">[{log.time}]</span>
                                    <span className="flex items-start sm:items-center text-blue-900">
                                        <IconChevronRight size={10} className="mr-1 mt-0.5 sm:mt-0 flex-shrink-0"/> 
                                        <span>{log.action}</span>
                                    </span>
                                </div>
                            ))}
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VeritasApp />);
    </script>
</body>
</html>
